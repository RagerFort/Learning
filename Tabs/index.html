<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabs</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <button class="button active" data-tab="1">First Button</button>
      <button class="button" data-tab="2">Second Button</button>
      <button class="button" data-tab="3">Third Button</button>
      <button class="button" data-tab="4">Fourth Button</button>
    </header>
    <main>
      <div class="tab-content active" id="content-1">First Content</div>
      <div class="tab-content" id="content-2">Second Content</div>
      <div class="tab-content" id="content-3">Third Content</div>
      <div class="tab-content" id="content-4">Fourth Content</div>
    </main>

    <script src="main.js"></script>
  </body>
</html>
