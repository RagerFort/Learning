<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- GIF already autoplays and loops by default -->
    <img
      class="anime"
      src="https://media0.giphy.com/media/v1.Y2lkPTZjMDliOTUyem9qdHowcHlpbW03MjBmMWlzYmJrZ3Q5Mmw4amxkaG16azY2dHJoZCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/05njtoxU99m9g3lus9/source.gif"
      alt="dog"
      style="width: 100px; height: 100px"
    />

    <!-- autoplay: starts immediately | loop: repeats forever -->

    <!-- autoplay=1: starts immediately | loop=1&playlist=...: loops the video -->
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/pU45H4Yl5ZY?si=OCBaaa6zaCt5Eltd&mute=1"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
